[project]
name = "fraudlab"
version = "0.1.0"
description = "Production ML learning lab: real-time fraud detection with MLflow, Feast and Airflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlflow==3.17.2",
  "feast[redis,postgres,duckdb]==0.67.0",
  "scikit-learn>=1.9,<1.10",
  "pandas>=2.3,<3",
  "pyarrow>=21",
  "numpy>=2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
fraudlab = "fraudlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlab"]

[tool.pytest.ini_options]
testpaths = ["checks", "tests"]
addopts = "-q -rN --tb=short -p no:cacheprovider"
markers = [
  "services: needs the docker compose stack running",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008", "E501"]  # typer.Option(...) defaults are the typer idiom; the formatter owns line length
